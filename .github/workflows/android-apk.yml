name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Eleven Says
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Restore official offline Mia voice assets
        run: ./scripts/fetch-local-voice-assets.sh

      - name: Verify brand, AI coach, learning flow and bundled audio
        run: |
          npm run verify:brand
          npm run verify:ai
          npm run verify:audio
          npm run verify:speech
          npm run verify:learning

      - name: Sync bundled web app into Android
        run: npm run sync:android

      - name: Restore update-compatible signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          EXPECTED_CERT="abb831763b8c11f6000b3cdc69cecae420f7dc1ea3d103592531f7d6548e4c56"
          KEY_CERT="$(keytool -list -v -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$EXPECTED_CERT" = "$KEY_CERT"
          echo "Signing key matches the installed V2.5 update certificate."

      - name: Build installable debug APK
        working-directory: android
        env:
          ELEVEN_AI_PROXY_URL: ${{ secrets.ELEVEN_AI_PROXY_URL }}
          ELEVEN_AI_ACCESS_TOKEN: ${{ secrets.ELEVEN_AI_ACCESS_TOKEN }}
        run: ./gradlew assembleDebug

      - name: Verify APK signature and upgrade compatibility
        run: |
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER_PATH" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          EXPECTED_CERT="abb831763b8c11f6000b3cdc69cecae420f7dc1ea3d103592531f7d6548e4c56"
          CERT_INFO="$("$APKSIGNER_PATH" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          printf '%s\n' "$CERT_INFO"
          NEW_CERT="$(printf '%s\n' "$CERT_INFO" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test -n "$NEW_CERT"
          echo "Built APK certificate: $NEW_CERT"
          test "$EXPECTED_CERT" = "$NEW_CERT"
          echo "APK signature matches the installed V2.5 update certificate."

      - name: Upload Eleven Says APK
        uses: actions/upload-artifact@v7
        with:
          name: ElevenSays-Android-V2.6.0-REAL-ABILITY-PRIVATE-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
