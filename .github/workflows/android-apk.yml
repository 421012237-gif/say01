name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out SAY/01
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync bundled web app into Android
        run: npm run sync:android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER_PATH" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SAY/01 APK
        uses: actions/upload-artifact@v7
        with:
          name: SAY01-Android-V2.3-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
